openapi: 3.1.0
info:
  version: 1.0.0
  title: Contacts app
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This is a documentation of contacts app
tags:
  - name: Contacts
    description: Operations about users.
  - name: Auth
    description: Auth operations.
servers:
  - url: http://localhost:3000
  - url: https://github.com/LarysaDrahuzia/nodejs-hw-mongodb/tree/hw6-email-and-images
  - url: https://nodejs-hw-mongodb-5-kk5y.onrender.com

paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{contactId}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
  /auth/register:
    post:
      $ref: ../swagger/paths/auths/register.yaml
  /auth/login:
    post:
      $ref: ../swagger/paths/auths/login.yaml
  /auth/refresh:
    post:
      $ref: ../swagger/paths/auths/refresh.yaml
  /auth/logout:
    post:
      $ref: ../swagger/paths/auths/logout.yaml
  /auth/send-reset-email:
    post:
      $ref: ../swagger/paths/auths/send-reset-email.yaml
  /auth/reset-pwd:
    post:
      $ref: ../swagger/paths/auths/reset-pwd.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
