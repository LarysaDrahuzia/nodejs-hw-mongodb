tags:
  - Auth
summary: Send reset
operationId: requestResetToken
description: 'Request reset password by email'
security: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - email
        properties:
          email:
            description: 'User`s email'
            type: string
            example: 'smit_tom@example.com'
responses:
  '200':
    description: 'Reset password email has been successfully sent'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Reset password email has been successfully sent'
            data:
              type: object
              required:
                - accessToken
              properties: {}

  '404':
    $ref: '../../components/responses/404.yaml'
