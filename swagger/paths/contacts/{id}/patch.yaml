tags:
  - Contacts
summary: Update contact
operationId: updateContact
description: 'Update a contact with payload'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: 'Contact`s name'
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Contact`s phone number'
            type: string
            example: '0-97-12-34-567'
          email:
            description: 'Contact`s email'
            type: string
            example: 'john_doe@example.com'
          isFavourite:
            description: 'Is the contact a favorite'
            type: boolean
            example: false
          contactType:
            description: 'Type of contact'
            type: string
            example:
            enum: ['work', 'home', 'personal']
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
            example: 'https://res.cloudinary.com/dubicsfnc/image/upload/v1749239636/gqot0t96.jpg'
responses:
  '200':
    description: 'Successfully patched contact!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched contact!'
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '500':
    $ref: '../../../components/responses/500.yaml'
