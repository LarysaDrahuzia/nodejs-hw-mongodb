tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            description: 'Contact`s name'
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Contact`s phone number'
            type: string
            example: '0-97-12-34-567'
          email:
            description: 'Contact`s email'
            type: string
            example: 'john_doe@example.com'
          isFavourite:
            description: 'Is the contact a favorite'
            type: boolean
            example: false
          contactType:
            description: 'Type of contact'
            type: string
            example:
            enum: ['work', 'home', 'personal']
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
            example: 'https://res.cloudinary.com/dubicsfnc/image/upload/v1749239636/gqot0t96.jpg'
responses:
  '201':
    description: 'Successfully created contact!'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: 'Successfully created contact!'
            data:
              type: object
              $ref: ../../components/schemas/contact.yaml
  '401':
    $ref: '../../components/responses/401.yaml'
